<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
<defs>
  <radialGradient id="sky" cx="50%" cy="42%" r="78%">
    <stop offset="0%" stop-color="#ffe066"/>
    <stop offset="100%" stop-color="#f7a823"/>
  </radialGradient>
  <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f2b968"/>
    <stop offset="100%" stop-color="#d98f36"/>
  </linearGradient>
  <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c47f31"/>
    <stop offset="100%" stop-color="#9c5f20"/>
  </linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3a3f4a"/>
    <stop offset="45%" stop-color="#101318"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffe9a3"/>
    <stop offset="50%" stop-color="#f0c030"/>
    <stop offset="100%" stop-color="#b8860b"/>
  </linearGradient>
  <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff8fa8"/>
    <stop offset="100%" stop-color="#e2506f"/>
  </linearGradient>
</defs>

<!-- background -->
<rect width="1000" height="1000" fill="url(#sky)"/>
<g opacity="0.16" fill="#ffffff">
  <path d="M620 440 L1399 391 L1399 489 Z"/><path d="M611 486 L1349 738 L1311 830 Z"/><path d="M585 525 L1170 1040 L1100 1110 Z"/><path d="M546 551 L890 1251 L798 1289 Z"/><path d="M500 560 L549 1339 L451 1339 Z"/><path d="M454 551 L202 1289 L110 1251 Z"/><path d="M415 525 L-100 1110 L-170 1040 Z"/><path d="M389 486 L-311 830 L-349 738 Z"/><path d="M380 440 L-399 489 L-399 391 Z"/><path d="M389 394 L-349 142 L-311 50 Z"/><path d="M415 355 L-170 -160 L-100 -230 Z"/><path d="M454 329 L110 -371 L202 -409 Z"/><path d="M500 320 L451 -459 L549 -459 Z"/><path d="M546 329 L798 -409 L890 -371 Z"/><path d="M585 355 L1100 -230 L1170 -160 Z"/><path d="M611 394 L1311 50 L1349 142 Z"/>
</g>

<!-- shoulders -->
<ellipse cx="500" cy="1020" rx="330" ry="200" fill="#c9832d"/>
<ellipse cx="500" cy="1020" rx="330" ry="200" fill="none" stroke="#6e3f12" stroke-width="9"/>

<!-- gold chain -->
<g>
  <circle cx="310.0" cy="862.0" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="333.8" cy="874.1" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="357.5" cy="885.7" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="381.3" cy="896.4" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="405.0" cy="905.8" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="428.8" cy="913.6" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="452.5" cy="919.3" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="476.3" cy="922.8" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="500.0" cy="924.0" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="523.8" cy="922.8" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="547.5" cy="919.3" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="571.3" cy="913.6" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="595.0" cy="905.8" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="618.8" cy="896.4" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="642.5" cy="885.7" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="666.3" cy="874.1" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/><circle cx="690.0" cy="862.0" r="15" fill="url(#gold)" stroke="#7a5600" stroke-width="3"/>
</g>

<!-- LEFT ear: long and floppy, hanging well past the jaw -->
<g transform="rotate(-14 268 520)">
  <path d="M 268 300 C 150 330, 118 560, 178 724 C 212 816, 326 818, 350 722 C 392 556, 372 338, 268 300 Z"
        fill="url(#ear)" stroke="#6e3f12" stroke-width="10" stroke-linejoin="round"/>
</g>
<!-- RIGHT ear: flipped up, because one ear is always wrong -->
<g transform="rotate(26 738 420)">
  <path d="M 738 592 C 628 520, 612 266, 736 206 C 862 266, 850 520, 738 592 Z"
        fill="url(#ear)" stroke="#6e3f12" stroke-width="10" stroke-linejoin="round"/>
  <path d="M 738 548 C 668 494, 660 318, 736 272 C 814 318, 806 494, 738 548 Z"
        fill="#e39a7a" opacity="0.55"/>
</g>

<!-- head -->
<ellipse cx="500" cy="500" rx="262" ry="248" fill="url(#fur)" stroke="#6e3f12" stroke-width="10"/>

<!-- brow patch, slightly lopsided -->
<ellipse cx="372" cy="372" rx="78" ry="46" fill="#c07d2e" opacity="0.5" transform="rotate(-12 372 372)"/>

<!-- muzzle -->
<ellipse cx="500" cy="648" rx="172" ry="124" fill="#f9e3bb" stroke="#6e3f12" stroke-width="9"/>

<!-- open mouth -->
<path d="M 362 672 Q 500 800 638 672 Q 500 716 362 672 Z" fill="#8f2f41" stroke="#6e3f12" stroke-width="8" stroke-linejoin="round"/>

<!-- tongue, hanging out to one side -->
<path d="M 530 706 C 640 714, 672 790, 636 846 C 606 892, 530 884, 516 828 C 506 784, 512 740, 530 706 Z"
      fill="url(#tongue)" stroke="#6e3f12" stroke-width="8" stroke-linejoin="round"/>
<path d="M 572 730 C 586 772, 584 812, 572 846" fill="none" stroke="#c04163" stroke-width="7" stroke-linecap="round"/>

<!-- nose -->
<path d="M 500 552 C 556 552, 580 584, 566 610 C 552 634, 516 644, 500 644 C 484 644, 448 634, 434 610 C 420 584, 444 552, 500 552 Z"
      fill="#2a211c" stroke="#120d0a" stroke-width="5"/>
<ellipse cx="470" cy="578" rx="17" ry="11" fill="#ffffff" opacity="0.45" transform="rotate(-20 470 578)"/>

<!-- sunglasses -->
<g>
  <!-- arms -->
  <path d="M 266 452 L 180 424" stroke="#0b0d11" stroke-width="20" stroke-linecap="round"/>
  <path d="M 734 452 L 820 424" stroke="#0b0d11" stroke-width="20" stroke-linecap="round"/>
  <!-- bridge -->
  <path d="M 452 452 Q 500 432 548 452" fill="none" stroke="#0b0d11" stroke-width="22" stroke-linecap="round"/>
  <!-- lenses -->
  <rect x="262" y="398" width="206" height="152" rx="56" fill="url(#lens)" stroke="#0b0d11" stroke-width="12"/>
  <rect x="532" y="398" width="206" height="152" rx="56" fill="url(#lens)" stroke="#0b0d11" stroke-width="12"/>
  <!-- glints -->
  <g opacity="0.38" fill="#ffffff">
    <path d="M 300 530 L 364 410 L 398 410 L 334 530 Z"/>
    <path d="M 348 530 L 412 410 L 430 410 L 366 530 Z"/>
    <path d="M 570 530 L 634 410 L 668 410 L 604 530 Z"/>
    <path d="M 618 530 L 682 410 L 700 410 L 636 530 Z"/>
  </g>
</g>

<!-- one raised eyebrow over the glasses -->
<path d="M 300 352 Q 360 316, 424 344" fill="none" stroke="#6e3f12" stroke-width="18" stroke-linecap="round"/>
<path d="M 574 334 Q 638 310, 700 342" fill="none" stroke="#6e3f12" stroke-width="18" stroke-linecap="round"/>

<text x="500" y="112" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
      font-size="92" fill="#ffffff" stroke="#6e3f12" stroke-width="9" paint-order="stroke"
      letter-spacing="4">TOO COOL</text>
</svg>
